<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0c16" />
    <meta name="description" content="Grayler turns meeting notes and transcripts into a concise summary, action items, and decisions — instantly." />
    <link rel="canonical" href="https://grayler.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Grayler — Meeting Notes Summarizer" />
    <meta property="og:description" content="Paste meeting notes or a transcript and get a clean summary, action items, and decisions." />
    <meta property="og:url" content="https://grayler.app/" />
    <meta property="og:image" content="https://grayler.app/logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Grayler — Meeting Notes Summarizer" />
    <meta name="twitter:description" content="Paste meeting notes or a transcript and get a clean summary, action items, and decisions." />
    <meta name="twitter:image" content="https://grayler.app/logo.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Grayler — Meeting Summarizer</title>
    <script>
      // avoid flash of wrong theme before React mounts
      try {
        const saved = localStorage.getItem('grayler-theme')
        const theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
